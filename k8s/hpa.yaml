apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mecanica-execucao
  namespace: mecanica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mecanica-execucao
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
