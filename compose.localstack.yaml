services:
  localstack:
    image: localstack/localstack:4.9.2
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: dynamodb,sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
