spring.application.name=fiap-soat-mecanica-execucao
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
execucao.aws.region=${AWS_REGION:us-east-1}
execucao.aws.endpoint=${AWS_ENDPOINT:}
execucao.aws.access-key=${AWS_ACCESS_KEY_ID:}
execucao.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
execucao.aws.session-token=${AWS_SESSION_TOKEN:}
execucao.diagnostico.ordens-table=${EXECUCAO_ORDENS_TABLE:execucao-ordens}
execucao.diagnostico.idempotencia-table=${EXECUCAO_IDEMPOTENCIA_TABLE:execucao-idempotencia}
execucao.diagnostico.outbox-table=${EXECUCAO_OUTBOX_TABLE:execucao-outbox}
execucao.estoque.pecas-table=${EXECUCAO_PECAS_TABLE:execucao-pecas}
execucao.estoque.reservas-table=${EXECUCAO_RESERVAS_TABLE:execucao-reservas}
execucao.diagnostico.command-queue-url=${EXECUCAO_COMMAND_QUEUE_URL:}
execucao.diagnostico.event-topic-arn=${EXECUCAO_EVENT_TOPIC_ARN:}
execucao.os.base-url=${EXECUCAO_OS_BASE_URL:}
